<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Машинка</title>
    <style>
         body {
            margin: 0;
            padding: 0;
            background-color: #7aceff;
        }
        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background-color: #2e2d2d;
            border-top: 10px solid white;
        }
        .car {
            width: 200px;
            height: 90px;
            position: absolute;
            bottom: 80px;
            left: -200px;
            animation: Come-On 3s forwards;
        }
        .car-bottom {
            position: absolute;
            bottom: 0;
            width: 200px;
            height: 50px;
            background-color: #ff5e00;
            border-radius: 5px 25px 5px 5px;
        }
        .cabina {
            position: absolute;
            top: 0;
            left: 100px;
            width: 80px;
            height: 45px;
            background-color: #ff5e00;
            border-radius: 10px 30px 0 0;
        }
    
        .steklo {
            position: absolute;
            background-color: #bfe6f5;
            border: 3px solid black;
            top: 10px;

            width: 40px;
            height: 25px;
            left: 20px;
            border-radius: 5px 30px 0 0;
        }
        .wheel {
            width: 40px;
            height: 40px;
            background-color: black;
            border-radius: 50%;
            position: absolute;
            bottom: -15px;            
        }
        .wheel-1 { left: 25px; }
        .wheel-2 { right: 25px; }
        
        @keyframes Come-On {
            from { left: -200px; }
            to { left: calc(100% - 250px); }			
        }
    </style>
</head>
<body>
    <div class="road"></div>
    <div class="car">
        <div class="cabina">            
            <div class="steklo"></div>
        </div>
        <div class="car-bottom"></div>
        <div class="wheel wheel-1"></div>
        <div class="wheel wheel-2"></div>
    </div>
</body>
</html>
